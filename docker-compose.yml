services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Only_123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local_Dev_Only_123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  fake-erp:
    build:
      context: .
      dockerfile: src/FakeErp.Api/Dockerfile
    ports:
      - "5080:8080"

  sync-worker:
    build:
      context: .
      dockerfile: src/SyncWorker/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      fake-erp:
        condition: service_started
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__Sync: "Server=sqlserver;Database=SyncWorker;User Id=sa;Password=Local_Dev_Only_123!;TrustServerCertificate=True"
      Erp__BaseUrl: "http://fake-erp:8080/"
      Sync__IntervalSeconds: "15"
