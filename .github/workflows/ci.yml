name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IncrementalSyncWorker.sln

      - name: Build
        run: dotnet build IncrementalSyncWorker.sln --no-restore -c Release

      - name: Test
        run: dotnet test IncrementalSyncWorker.sln --no-build -c Release --logger "console;verbosity=normal"
